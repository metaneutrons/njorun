[package]
name = "njorun-ha-client"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
njorun-app-core = { version = "=0.1.0", path = "../app-core" }
njorun-management = { version = "=0.1.0", path = "../management" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
base64 = "=0.23.1"
getrandom = "=0.3.4"
mdns-sd = { version = "=0.21.4", default-features = false }
sha2 = "=0.11.1"
tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
ureq = { version = "=3.5.1", features = ["json"] }
url = "=2.5.8"
time = { version = "=0.3.55", features = ["parsing"] }

[dev-dependencies]
njorun-pairing = { version = "=0.1.0", path = "../pairing" }
