name: CI
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Repository checks
    runs-on: ubuntu-24.04
    outputs:
      host: ${{ steps.plan.outputs.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select applicable host checks
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/plan.py --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: python3 -m py_compile experiments/ha-callback/qualify.py
      - run: python3 scripts/ci/install-tools.py
      - run: python3 scripts/check-repository.py
      - name: Verify canonical brand assets
        run: |
          python3 scripts/brand/generate.py
          git diff --exit-code -- assets/brand
      - run: actionlint
      - run: lefthook validate
      - run: gitleaks git --redact --log-opts="--all"
      - run: git diff-tree --check --root HEAD
  host:
    name: Host application qualification
    needs: quality
    if: needs.quality.outputs.host == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: python3 scripts/ci/install-tools.py --manifest scripts/ci/rust-tools.json
      - name: Install native simulator prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfontconfig1-dev libxkbcommon-dev libx11-dev
      - run: python3 scripts/ci/install-tools.py --manifest scripts/ci/python-tools.json
      - name: Install locked Python qualification environment
        run: uv sync --locked
      - run: uv run --locked ruff check custom_components tests/integration tests/release scripts/release experiments/vertical-slice
      - run: uv run --locked python -m unittest discover -s tests/integration -p 'test_*.py'
      - run: uv run --locked python -m unittest discover -s tests/release -p 'test_*.py'
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path experiments/p4-build/Cargo.toml --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --workspace --all-features --locked
      - name: Qualify HA authorization API with disposable storage
        timeout-minutes: 5
        run: python3 experiments/ha-callback/qualify.py
      - name: Qualify native UI and real HA integration with coverage
        timeout-minutes: 20
        run: bash scripts/ci/qualify-host.sh
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny --locked check
      - run: cargo deny --manifest-path experiments/p4-build/Cargo.toml --locked check
  p4-build:
    name: Reproducible P4 cross-build
    needs: quality
    if: needs.quality.outputs.host == 'true'
    uses: ./.github/workflows/p4-build.yml
    permissions:
      contents: read

  commit-hygiene:
    name: Commit hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check title, body and every commit
        # Title and body reach the script exclusively through env, never by
        # interpolation into the script text: otherwise the pull request title
        # would be a shell injection vector.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          status=0
          if [ "${#PR_TITLE}" -gt 100 ]; then exit 1; fi
          cc='^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+|Revert ".+")'
          # grep works line by line, hence .* rather than [^\n]*: in ERE
          # [^\n] would be the class "neither a backslash nor an n" and would
          # exclude names containing an 'n'. In the RE2 rule of the ruleset
          # [^\n] is the correct one. Anchored at the start of the line: by
          # convention a trailer stands on a line of its own. Without the anchor
          # the rule also fires when a pull request body merely mentions the
          # forbidden trailer, for instance to describe a doctor finding, and it
          # then rejects a valid input.
          ban='^[[:space:]]*co-authored-by:.*(claude|anthropic)|^[[:space:]]*generated with.*claude code'

          # On a squash merge the pull request title becomes the subject line
          # on main and thereby determines the next version.
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$cc"; then
            echo "::error::pull request title does not follow Conventional Commits: $PR_TITLE"
            status=1
          fi

          # With squash_merge_commit_message=PR_BODY the body lands in the commit.
          if printf '%s' "$PR_BODY" | grep -Eiq "$ban"; then
            echo "::error::the pull request body contains an AI attribution trailer."
            status=1
          fi

          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            if git log -1 --format=%B "$sha" | grep -Eiq "$ban"; then
              echo "::error::commit $sha contains an AI attribution trailer."
              status=1
            fi
            email=$(git log -1 --format='%ae%n%ce' "$sha")
            if printf '%s' "$email" | grep -Fq 'noreply@anthropic.com'; then
              echo "::error::commit $sha has an Anthropic address as author or committer."
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "::notice::switch this off for good in ~/.claude/settings.json: {\"attribution\":{\"commit\":\"\",\"pr\":\"\"}}"
            exit 1
          fi


  ci-success:
    name: CI Success
    if: always()
    needs: [quality, commit-hygiene, host, p4-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Require repository checks and applicable hygiene checks
        env:
          QUALITY: ${{ needs.quality.result }}
          HOST: ${{ needs.host.result }}
          P4: ${{ needs.p4-build.result }}
          HOST_REQUIRED: ${{ needs.quality.outputs.host }}
          HYGIENE: ${{ needs.commit-hygiene.result }}
          EVENT: ${{ github.event_name }}
        run: |
          test "$QUALITY" = success
          if [ "$HOST_REQUIRED" = true ]; then
            test "$HOST" = success
            test "$P4" = success
          else
            test "$HOST" = skipped
            test "$P4" = skipped
          fi
          if [ "$EVENT" = pull_request ]; then
            test "$HYGIENE" = success
          else
            test "$HYGIENE" = skipped
          fi
