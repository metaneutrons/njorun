[workspace]
members = ["crates/pairing", "crates/app-core", "crates/ha-client", "crates/simulator"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Snow 0.10 std enables ring (getrandom 0.2) alongside its own getrandom 0.3.
# cargo-deny reports duplicates; remove this allowance when upstream unifies them.
multiple_crate_versions = "allow"
