[workspace]
members = [
    "crates/pairing",
    "crates/management",
    "crates/app-core",
    "crates/ha-client",
    "crates/simulator",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Upstream crates (Slint, rustls, sha2/digest generations) still pull in two versions of
# several crates. cargo-deny reports the duplicates; remove this allowance when they unify.
multiple_crate_versions = "allow"
